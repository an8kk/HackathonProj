services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hackathon}
      POSTGRES_USER: ${POSTGRES_USER:-hackathon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hackathon}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      BACKEND_PORT: ${BACKEND_PORT:-4000}
      DATABASE_URL: ${DATABASE_URL:-postgres://hackathon:hackathon@postgres:5432/hackathon}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      STORAGE_DIR: /app/storage
      IIKO_WEB_BASE_URL: ${IIKO_WEB_BASE_URL:-https://demo-pro.iikoweb.co.uk}
      IIKO_WEB_LOGIN: ${IIKO_WEB_LOGIN:-}
      IIKO_WEB_PASSWORD: ${IIKO_WEB_PASSWORD:-}
      IIKO_WEB_STORE_ID: ${IIKO_WEB_STORE_ID:-}
      IIKO_SERVER_BASE_URL: ${IIKO_SERVER_BASE_URL:-}
      IIKO_SERVER_LOGIN: ${IIKO_SERVER_LOGIN:-}
      IIKO_SERVER_PASSWORD_SHA1: ${IIKO_SERVER_PASSWORD_SHA1:-}
      IIKO_SERVER_STORE_ID: ${IIKO_SERVER_STORE_ID:-}
      IIKO_SERVER_ACCOUNT_ID: ${IIKO_SERVER_ACCOUNT_ID:-}
      JWT_SECRET: ${JWT_SECRET:-dev-insecure-secret-change-me}
    ports:
      - "4000:4000"
    volumes:
      - backend-storage:/app/storage
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:4000/health').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:4000}
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/frontend/src
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data:
  backend-storage:

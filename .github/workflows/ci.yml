name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Litestar / pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -e ".[test]"
      - name: Run tests
        run: pytest -q

  frontend:
    name: Frontend (React / Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run lint -w @hackathon/frontend
      - name: Test
        run: npm test -w @hackathon/frontend
      - name: Build
        run: npm run build -w @hackathon/frontend

  mobile:
    name: Mobile (Flutter)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test

  e2e-smoke:
    name: E2E smoke (docker compose)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose config
        run: docker compose config --quiet
      - name: Build images
        run: docker compose build backend frontend
      - name: Boot stack
        run: docker compose up -d postgres backend
      - name: Wait for backend health
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:4000/health; then
              echo "backend healthy"; exit 0
            fi
            sleep 3
          done
          echo "backend did not become healthy"; docker compose logs backend; exit 1
      - name: Smoke test auth + write-off integration
        run: |
          set -euo pipefail
          # login is public
          SENDER=$(curl -fsS -X POST http://localhost:4000/auth/login -H 'content-type: application/json' -d '{"pin":"1111"}')
          echo "$SENDER" | grep -q '"role":"sender"'
          # protected routes require the bearer token
          curl -fsS -o /dev/null -w '%{http_code}' http://localhost:4000/integrations/iiko/status | grep -q 401
          TOKEN=$(printf '%s' "$SENDER" | sed -n 's/.*"token":"\([^"]*\)".*/\1/p')
          curl -fsS -H "Authorization: Bearer $TOKEN" http://localhost:4000/integrations/iiko/status | grep -q writeoffDocument
      - name: Tear down
        if: always()
        run: docker compose down -v
